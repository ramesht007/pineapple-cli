version: 2
project_name: pineapple-cli

builds:
  - id: pine
    binary: pine
    main: .
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/ramesht007/pineapple-cli/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "pine_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"

release:
  github:
    owner: ramesht007
    name: pineapple-cli

homebrew_casks:
  - name: pine
    repository:
      owner: ramesht007
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/ramesht007/pineapple-cli
    description: "Sync Claude Code skills, plugins, settings and secrets across machines via GitHub"
    # binaries are unsigned; casks quarantine downloads, so clear it on pine only
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pine"]
          end
